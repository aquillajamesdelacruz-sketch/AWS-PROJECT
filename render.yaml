services:
  - type: web
    name: marketplace-product-reader
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free            # Chromium needs RAM: if it crashes with out-of-memory, move to a paid plan
    healthCheckPath: /api/health
    envVars:
      - key: ALLOWED_ORIGINS
        sync: false       # e.g. https://your-site.web.app,http://localhost:5173
      - key: PLAYWRIGHT_CONCURRENCY
        value: "1"